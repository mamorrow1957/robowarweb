name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools for native modules
        run: sudo apt-get install -y build-essential python3

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=smoke
        env:
          JWT_SECRET: ci-test-secret

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s --max-time 10 -X POST -H 'Content-type: application/json' \
            --data '{"text":":x: *RoboWar smoke tests failed* on `${{ github.ref_name }}`\n${{ github.event.head_commit.message }}\nSee: https://github.com/mamorrow1957/robowarweb/actions"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  test-extended:
    name: Extended tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools for native modules
        run: sudo apt-get install -y build-essential python3

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run extended tests
        run: npx playwright test --project=extended
        env:
          JWT_SECRET: ci-test-secret

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s --max-time 10 -X POST -H 'Content-type: application/json' \
            --data '{"text":":warning: *RoboWar extended tests failed* on `${{ github.ref_name }}`\n${{ github.event.head_commit.message }}\nSee: https://github.com/mamorrow1957/robowarweb/actions"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-extended
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/robowarweb
          git pull origin main

      - name: Deploy
        run: ~/robowarweb/scripts/deploy.sh

      - name: Notify Slack on deploy success
        if: success()
        run: |
          curl -s --max-time 10 -X POST -H 'Content-type: application/json' \
            --data '{"text":":rocket: *RoboWar deployed successfully* to https://robowar.morroweb.com"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Notify Slack on deploy failure
        if: failure()
        run: |
          curl -s --max-time 10 -X POST -H 'Content-type: application/json' \
            --data '{"text":":fire: *RoboWar deploy failed* — check the server!"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
